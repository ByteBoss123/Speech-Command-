name: Real speech experiment tests
on:
  push:
    paths: ['speechlab/**', 'tests_speech/**', 'requirements-speech.txt', '.github/workflows/speech-tests.yml']
  pull_request:
    paths: ['speechlab/**', 'tests_speech/**', 'requirements-speech.txt', '.github/workflows/speech-tests.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-speech.txt
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-speech.txt
      - run: python -m pytest tests_speech -q
        env:
          HF_HUB_OFFLINE: '1'
